services:
  dev:
    container_name: otel_polyglot_dev
    build:
      context: docker/dev
    profiles: [ "dev" ]
    volumes:
      - '.:/usr/code'
    working_dir: '/usr/code'
    env_file:
      - .env
    command: [ '/bin/sh', '-c', 'sleep infinity' ]

  go-gin:
    container_name: otel_polyglot_go_gin
    build:
      context: services/go-gin
      target: dev
    profiles: [ "go-gin" ]
    volumes:
      - './services/go-gin:/usr/code'
      - './certs:/etc/otel/certs:ro'
      - './certs/ca.crt:/usr/local/share/ca-certificates/otel-ca.crt:ro'
    working_dir: '/usr/code'
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://lgtm:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=false
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.crt
      - OTEL_LOGS_EXPORTER=otlp
    env_file:
      - .env
    entrypoint: [ '/bin/sh', '-c', 'update-ca-certificates 2>/dev/null || true && sleep infinity' ]
    restart: always
    depends_on:
      lgtm:
        condition: service_started

  lgtm:
    container_name: otel_polyglot_lgtm
    image: grafana/otel-lgtm:latest
    profiles: [ "default" ]
    volumes:
      - './prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro'
      - './otel/collector/config.yaml:/otel-lgtm/otelcol-config.yaml:ro'
      - './certs:/etc/otel/certs:ro'
    restart: always
    environment:
      - ENABLE_LOGS_OTELCOL=true
    ports:
      - "3000:3000"
      - "9000:9000"

